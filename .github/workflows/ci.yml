name: API Gateway CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: api-gateway-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout API Gateway source
        uses: actions/checkout@v4

      - name: Checkout Config Server source
        uses: actions/checkout@v4
        with:
          repository: azazkhan07/config-server
          path: config-server

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: api-gateway/pom.xml

      - name: Inspect Config Server checkout
        run: |
          echo "Config Server checkout:"
          ls -la ./config-server
          echo "Dockerfiles found:"
          find ./config-server -type f -name Dockerfile -print

      - name: Build Config Server Docker image
        run: docker build -t novapay-config-server:ci ./config-server

      - name: Start Config Server
        run: |
          docker run -d \
            --name config-server \
            -p 8089:8089 \
            -e EUREKA_CLIENT_ENABLED=false \
            -e EUREKA_CLIENT_REGISTER_WITH_EUREKA=false \
            -e EUREKA_CLIENT_FETCH_REGISTRY=false \
            novapay-config-server:ci

      - name: Wait for Config Server
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://localhost:8089/actuator/health; then
              echo "Config Server is responding."
              exit 0
            fi
            sleep 2
          done
          echo "Config Server did not become ready."
          docker logs config-server
          exit 1

      - name: Run Maven tests
        working-directory: ./api-gateway
        env:
          CONFIG_SERVER_URL: http://localhost:8089/
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API Gateway Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/api-gateway
        run: |
          docker build -t "$IMAGE_NAME:${{ github.sha }}" ./api-gateway
          docker tag "$IMAGE_NAME:${{ github.sha }}" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"
